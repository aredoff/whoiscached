version: "2"

run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50

linters:
  default: standard
  disable:
    - dupl
    - godot
    - paralleltest
    - testifylint

  settings:
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 120
      statements: 80
    gocyclo:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 4
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
    - gofumpt
  settings:
    gofumpt:
      extra-rules: true
